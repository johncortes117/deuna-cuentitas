    <script>
      // Tema antes de pintar (evita el destello blanco en modo oscuro).
      try {
        var t = localStorage.getItem('mitimiti-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
